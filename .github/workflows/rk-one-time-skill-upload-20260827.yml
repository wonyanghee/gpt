# Final database-skill repair and 11/11 verification: 2026-08-27
name: RK One-time OpenAI Skills Upload

on:
  push:
    paths:
      - '.github/workflows/rk-one-time-skill-upload-20260827.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repair database skill and verify all 11 remote packages
        shell: bash
        run: |
          set -euo pipefail

          FIX_URL='https://lbeevzcceemlgimcevdo.supabase.co/functions/v1/rk-fix-db-7c4e9a2b20260827'
          STATUS_URL='https://lbeevzcceemlgimcevdo.supabase.co/functions/v1/rk-status-a8c31e72'
          CONTENT_URL='https://lbeevzcceemlgimcevdo.supabase.co/functions/v1/rk-content-check-42f7d9c1'

          fix_code="$(curl --silent --show-error --max-time 300 --output /tmp/fix.json --write-out '%{http_code}' "$FIX_URL" || true)"
          status_code="$(curl --silent --show-error --max-time 120 --output /tmp/status.json --write-out '%{http_code}' "$STATUS_URL" || true)"
          content_code="$(curl --silent --show-error --max-time 300 --output /tmp/content.json --write-out '%{http_code}' "$CONTENT_URL" || true)"

          FIX_CODE="$fix_code" STATUS_CODE="$status_code" CONTENT_CODE="$content_code" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def read_json(path):
              text = Path(path).read_text(errors='replace') if Path(path).exists() else ''
              text = re.sub(r'sk-[A-Za-z0-9_-]+', '[REDACTED]', text)
              try:
                  return json.loads(text)
              except Exception:
                  return {'parse_error': True, 'raw': text[:3000]}

          fix = read_json('/tmp/fix.json')
          status = read_json('/tmp/status.json')
          content = read_json('/tmp/content.json')
          report = {
              'http_status': {
                  'database_skill_repair': os.environ.get('FIX_CODE'),
                  'remote_list': os.environ.get('STATUS_CODE'),
                  'remote_content': os.environ.get('CONTENT_CODE'),
              },
              'database_skill_repair': fix,
              'remote_list': status,
              'remote_content': content,
          }
          print('RESULT_JSON_BEGIN')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print('RESULT_JSON_END')

          fix_ok = fix.get('verified') is True and fix.get('remote_verified') is True
          list_ok = status.get('ok') is True and status.get('count') == 11
          content_ok = content.get('verified') is True and content.get('count') == 11 and content.get('mismatch_count') == 0
          if not (fix_ok and list_ok and content_ok):
              raise SystemExit('Remote 11/11 verification failed')
          PY