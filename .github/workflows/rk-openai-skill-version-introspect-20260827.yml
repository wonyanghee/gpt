name: RK OpenAI Skill Version API Introspection

on:
  push:
    paths:
      - '.github/workflows/rk-openai-skill-version-introspect-20260827.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current Python SDK method signatures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet --upgrade openai
          python3 - <<'PY'
          import inspect
          import openai
          from openai import OpenAI
          client = OpenAI(api_key='sk-placeholder')
          print('OPENAI_SDK_VERSION=' + openai.__version__)
          print('SKILL_CREATE=' + str(inspect.signature(client.skills.create)))
          print('SKILL_UPDATE=' + str(inspect.signature(client.skills.update)))
          print('SKILL_VERSION_CREATE=' + str(inspect.signature(client.skills.versions.create)))
          print('SKILL_VERSION_CREATE_SOURCE_BEGIN')
          print(inspect.getsource(client.skills.versions.create))
          print('SKILL_VERSION_CREATE_SOURCE_END')
          PY